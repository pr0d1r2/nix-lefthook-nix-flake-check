---

pre-commit:
  commands:
    nix-flake-check:
      glob: "{*.nix,flake.lock}"
      run: timeout "$(bash nix-flake-check-default-timeout.sh)" nix flake check
    shfmt:
      glob: "*.sh"
      run: timeout ${LEFTHOOK_SHFMT_TIMEOUT:-30} shfmt -d -i 2 -ci {staged_files}

pre-push:
  commands:
    nix-flake-check:
      glob: "{*.nix,flake.lock}"
      run: timeout "$(bash nix-flake-check-default-timeout.sh)" nix flake check
    shfmt:
      glob: "*.sh"
      run: timeout ${LEFTHOOK_SHFMT_TIMEOUT:-30} shfmt -d -i 2 -ci {all_files}
